name = "prodrillos-pos"
account_id = "a56a3977dd8f5fae4cb759c7bd3ce3f0"
main = ".open-next/worker.js"
compatibility_date = "2026-10-14"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = false
routes = [{ pattern = "pos.prodrillos.com", custom_domain = true }]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "prodrillos-pos"

[vars]
APP_URL = "https://pos.prodrillos.com"
SHOP_TIMEZONE = "America/Mexico_City"
SHOP_CURRENCY = "mxn"
PAYPAL_ENV = "sandbox"
MERCADOPAGO_ENV = "sandbox"

# Configure DATABASE_URL, POS_USERNAME, POS_PASSWORD and gateway credentials
# with Wrangler secrets or the Cloudflare dashboard, never in this file.
[observability]
enabled = true
