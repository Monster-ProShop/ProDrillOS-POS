services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: prodrillos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pos_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prodrillos"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pos_data:
